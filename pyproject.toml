[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wai"
dynamic = ["version"]
description = "WAI — privacy-first LLM proxy and AI gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "bcrypt>=5.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "PyJWT>=2.13.0",
    "cryptography>=50.0.0",
    "uuid6>=2025.0.0",
    "pyyaml>=6.0.3",
    "prometheus-client>=0.26.0",
    "asyncpg>=0.31.0",
]

[project.scripts]
wai = "wai.cli:main"

[tool.setuptools.dynamic]
version = { attr = "wai.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wai = ["py.typed", "db/migrations/*.sql"]
