[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wai"
dynamic = ["version"]
description = "WAI — privacy-first LLM proxy and AI gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "bcrypt>=5.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "PyJWT>=2.15.0",
    "cryptography>=50.0.1",
    "uuid6>=2025.0.1",
    "pyyaml>=6.0.3",
    "prometheus-client>=0.26.0",
    "asyncpg>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
wai = "wai.cli:main"

[tool.setuptools.dynamic]
version = { attr = "wai.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wai = ["py.typed", "db/migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
